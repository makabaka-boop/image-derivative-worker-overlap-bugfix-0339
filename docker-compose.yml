services:
  api:
    build:
      context: ./backend
    image: imgcrop-app:latest
    environment:
      DATA_DIR: /data
      TEST_HOOKS: "1"
    volumes:
      - data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    image: imgcrop-app:latest
    environment:
      DATA_DIR: /data
      WORKER_CONCURRENCY: "2"
      # 滚动更新/崩溃接管：作业租约 TTL（秒），心跳按 TTL/3 自动续租。
      # 只有租约过期的 processing 作业才会被其他 worker 接管。
      # WORKER_LEASE_TTL_SECONDS: "30"
      TEST_HOOKS: "1"
    volumes:
      - data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # 必须小于 stop_grace_period，保证停机释放租约能在被 SIGKILL 前完成。
    stop_grace_period: 12s

  web:
    build:
      context: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # 一次性验收测试服务：docker compose run --rm verify
  verify:
    profiles: ["verify"]
    image: imgcrop-app:latest
    build:
      context: ./backend
    working_dir: /verify
    environment:
      BASE_URL: http://api:8000
      DATA_DIR: /tmp/recovery-data
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend/tests:/verify:ro
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider", "-q", "/verify"]
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  data:
